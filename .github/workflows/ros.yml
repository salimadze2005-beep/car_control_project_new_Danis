name: ROS simulation
on:
  push:
    branches: [ros, simulation]
  workflow_dispatch:
jobs:
  noetic:
    runs-on: ubuntu-22.04
    container: ros:noetic-ros-base-focal
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y python3-catkin-pkg python3-rospkg ros-noetic-rostest ros-noetic-rosnode ros-noetic-visualization-msgs
      - name: Pure controller and closed-loop tests
        run: python3 -m unittest discover -s ros/car_control_ros/test -p 'test_*.py' -v
      - name: Catkin build and ROS integration test
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          CAR_WS=/tmp/car_ws bash ros/build.sh
          cd /tmp/car_ws
          source devel/setup.bash
          python3 -c "from car_control_ros.core import Controller; from car_control_core.core import Controller as Shared; assert Controller is Shared"
          catkin_make run_tests
          catkin_test_results
          catkin_make install
          source install/setup.bash
          python3 -c "from car_control_ros.core import Controller; from car_control_core.core import Controller as Shared; assert Controller is Shared"
