name: ROS 2 Jetson
on:
  push:
    branches: [ros, "codex/jetson-ros2"]
    paths: ["ros2/**", ".github/workflows/ros2.yml"]
  pull_request:
    branches: [ros]
    paths: ["ros2/**", ".github/workflows/ros2.yml"]
  workflow_dispatch:
jobs:
  foxy:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ros:foxy-ros-base-focal
    steps:
      - uses: actions/checkout@v4
      - name: Refresh ROS signing key and install test dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          key = urllib.request.urlopen('https://raw.githubusercontent.com/ros/rosdistro/master/ros.key').read()
          pathlib.Path('/usr/share/keyrings/ros2-latest-archive-keyring.gpg').write_bytes(key)
          pathlib.Path('/usr/share/keyrings/ros-archive-keyring.gpg').write_bytes(key)
          PY
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest python3-numpy python3-serial ros-foxy-launch-ros
      - name: Build and test ROS 2 with Python 3.8
        shell: bash
        run: bash ros2/build.sh
      - name: Check installed entry points
        shell: bash
        run: |
          source /opt/ros/foxy/setup.bash
          source ros2/install/setup.bash
          ros2 launch car_jetson jetson.launch.py --show-args
          ros2 run car_jetson preflight --help
          ros2 interface show car_interfaces/msg/ConeArray
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile reference AVR firmware (Uno)
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo
          arduino-cli compile --fqbn arduino:avr:uno ros2/firmware/car_controller
